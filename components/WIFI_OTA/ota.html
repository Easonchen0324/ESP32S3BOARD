<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ESP32-S3 无线升级</title>
  <style>
    :root{color-scheme:dark;--bg:#071019;--panel:#0d1a27e8;--line:#ffffff17;--text:#edf7ff;--muted:#88a0b7;--cyan:#22d3ee;--blue:#3b82f6;--green:#34d399;--red:#fb7185;--yellow:#fbbf24}*{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:24px;background:radial-gradient(circle at 8% 5%,#0d5363 0,transparent 29%),radial-gradient(circle at 92% 92%,#193e82 0,transparent 32%),var(--bg);font:14px/1.5 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text)}
    .app{width:min(100%,980px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin:5px 2px 22px}.title{display:flex;align-items:center;gap:13px}.logo{display:grid;place-items:center;width:48px;height:48px;border-radius:15px;background:linear-gradient(145deg,var(--cyan),var(--blue));box-shadow:0 10px 35px #22d3ee42;font-size:23px}.top h1{margin:0;font-size:21px}.top p{margin:2px 0 0;color:var(--muted);font-size:12px}.online{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid #34d3993d;border-radius:999px;background:#34d39910;color:#83edc2;font-size:12px}.online i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green)}
    .grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.panel{border:1px solid var(--line);border-radius:22px;background:var(--panel);box-shadow:0 22px 65px #0007;backdrop-filter:blur(16px);overflow:hidden}.body{padding:23px}.panel h2{margin:0 0 4px;font-size:17px}.sub{margin:0 0 18px;color:var(--muted);font-size:12px}
    .drop{display:grid;place-items:center;min-height:190px;padding:25px;border:1px dashed #5d819e;border-radius:17px;background:#06111c8c;text-align:center;cursor:pointer;transition:.2s}.drop:hover,.drop.over{border-color:var(--cyan);background:#22d3ee0b}.drop .icon{font-size:35px;color:var(--cyan)}.drop strong{display:block;margin-top:9px;font-size:15px}.drop span{display:block;margin-top:3px;color:var(--muted);font-size:12px}.file{display:none;margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:#06111c}.file.show{display:flex;justify-content:space-between;gap:12px}.file small{color:var(--muted)}
    .progress{height:10px;margin:19px 0 8px;border-radius:99px;background:#ffffff0c;overflow:hidden}.bar{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--cyan),var(--blue));box-shadow:0 0 18px #22d3ee80;transition:width .3s}.progressMeta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;margin-top:18px}button{height:45px;border:0;border-radius:13px;padding:0 18px;color:white;font-weight:700;cursor:pointer}.primary{flex:1;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 10px 25px #268bd43d}.secondary{background:#ffffff0e;border:1px solid var(--line)}button:disabled{opacity:.45;cursor:not-allowed}
    .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}.stat{padding:13px;border:1px solid var(--line);border-radius:14px;background:#06111c}.stat span{display:block;color:var(--muted);font-size:11px}.stat b{display:block;margin-top:3px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.console{height:330px;padding:14px;border-top:1px solid var(--line);background:#030a11;overflow:auto;font:12px/1.65 ui-monospace,SFMono-Regular,Consolas,monospace}.line{display:flex;gap:9px}.time{color:#526c83}.tx{color:var(--cyan)}.rx{color:var(--green)}.err{color:var(--red)}.sys{color:var(--yellow)}.consoleHead{display:flex;justify-content:space-between;align-items:center;padding:15px 18px}.consoleHead h2{margin:0}.clear{height:29px;padding:0 10px;background:#ffffff0c;color:var(--muted);font-size:11px}.foot{margin:16px 3px;color:var(--muted);font-size:11px;text-align:center}
    @media(max-width:760px){body{padding:16px 12px}.grid{grid-template-columns:1fr}.top{align-items:flex-start}.online{margin-top:5px}.console{height:270px}}@media(max-width:420px){.body{padding:18px}.cards{grid-template-columns:1fr}.actions{flex-wrap:wrap}.secondary{flex:1}}
  </style>
</head>
<body>
  <main class="app">
    <header class="top"><div class="title"><div class="logo">⇧</div><div><h1>ESP32-S3 Wi‑Fi OTA</h1><p>安全、可视化的局域网固件升级</p></div></div><div class="online"><i></i><span id="online">设备在线</span></div></header>
    <div class="grid">
      <section class="panel"><div class="body"><h2>选择固件</h2><p class="sub">仅接受 ESP-IDF 生成的 .bin 应用固件</p><div class="drop" id="drop"><div><div class="icon">⬆</div><strong>点击选择或拖入固件</strong><span>传输节奏：16 KiB / 秒</span></div><input id="picker" type="file" accept=".bin,application/octet-stream" hidden></div><div class="file" id="file"><div><b id="fileName"></b><small id="fileSize"></small></div><small id="packetCount"></small></div><div class="progress"><div class="bar" id="bar"></div></div><div class="progressMeta"><span id="progressText">等待选择固件</span><span id="percent">0%</span></div><div class="actions"><button class="primary" id="upload" disabled>开始升级</button><button class="secondary" id="abort" disabled>取消</button><button class="secondary" id="reboot" disabled>重启生效</button></div></div></section>
      <section class="panel"><div class="body"><h2>设备状态</h2><p class="sub">ESP32 每秒返回一次当前状态</p><div class="cards"><div class="stat"><span>当前版本</span><b id="version">--</b></div><div class="stat"><span>运行分区</span><b id="partition">--</b></div><div class="stat"><span>设备地址</span><b id="ip">--</b></div><div class="stat"><span>Wi‑Fi 信号</span><b id="rssi">--</b></div></div></div><div class="consoleHead"><h2>实时数据交互</h2><button class="clear" id="clear">清空</button></div><div class="console" id="console"></div></section>
    </div><p class="foot">升级期间请保持设备供电和网络稳定。固件完整校验通过前不会切换启动分区。</p>
  </main>
  <script>
    const $=id=>document.getElementById(id),PACKET=16*1024,delay=ms=>new Promise(r=>setTimeout(r,ms));let firmware=null,uploading=false,cancelled=false;
    const format=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KiB':(n/1048576).toFixed(2)+' MiB';
    function log(kind,text){const line=document.createElement('div');line.className='line';const now=new Date().toLocaleTimeString('zh-CN',{hour12:false});line.innerHTML=`<span class="time">${now}</span><span class="${kind}">${kind.toUpperCase()}</span>`;const msg=document.createElement('span');msg.textContent=text;line.appendChild(msg);$('console').appendChild(line);$('console').scrollTop=$('console').scrollHeight}
    async function request(url,opt={}){const res=await fetch(url,opt);const data=await res.json().catch(()=>({message:'设备返回的数据格式无效'}));if(!res.ok)throw new Error(data.message||`HTTP ${res.status}`);return data}
    function choose(file){if(!file)return;if(!file.name.toLowerCase().endsWith('.bin')){log('err','请选择 .bin 固件文件');return}firmware=file;$('file').classList.add('show');$('fileName').textContent=file.name;$('fileSize').textContent=format(file.size);$('packetCount').textContent=Math.ceil(file.size/PACKET)+' 帧';$('upload').disabled=false;$('progressText').textContent='固件已就绪';log('sys',`已选择 ${file.name}，大小 ${format(file.size)}`)}
    $('drop').onclick=()=>$('picker').click();$('picker').onchange=e=>choose(e.target.files[0]);$('drop').ondragover=e=>{e.preventDefault();$('drop').classList.add('over')};$('drop').ondragleave=()=>$('drop').classList.remove('over');$('drop').ondrop=e=>{e.preventDefault();$('drop').classList.remove('over');choose(e.dataTransfer.files[0])};
    async function startUpload(){if(!firmware||uploading)return;uploading=true;cancelled=false;$('upload').disabled=true;$('abort').disabled=false;$('reboot').disabled=true;try{log('tx',`START size=${firmware.size}`);let ack=await request('/api/ota/start',{method:'POST',headers:{'X-Firmware-Size':String(firmware.size),'X-Firmware-Name':encodeURIComponent(firmware.name)}});log('rx',`目标分区 ${ack.partition}，允许开始写入`);let offset=0,sequence=0;while(offset<firmware.size){if(cancelled)throw new Error('升级已由用户取消');const end=Math.min(offset+PACKET,firmware.size),blob=firmware.slice(offset,end);sequence++;log('tx',`帧 #${sequence}  offset=${offset}  bytes=${blob.size}`);ack=await request(`/api/ota/chunk?offset=${offset}`,{method:'POST',headers:{'Content-Type':'application/octet-stream'},body:blob});offset=ack.received;const pct=Math.floor(offset*100/firmware.size);$('bar').style.width=pct+'%';$('percent').textContent=pct+'%';$('progressText').textContent=`${format(offset)} / ${format(firmware.size)}`;log('rx',`ACK #${sequence}  received=${offset}  progress=${pct}%`);if(offset<firmware.size)await delay(1000)}log('tx','FINISH 请求校验固件并切换启动分区');ack=await request('/api/ota/finish',{method:'POST'});$('bar').style.width='100%';$('percent').textContent='100%';$('progressText').textContent='升级成功，等待重启';$('reboot').disabled=false;log('rx',ack.message||'固件校验成功，新分区已就绪')}catch(e){log('err',e.message);$('progressText').textContent=e.message;$('upload').disabled=false}finally{uploading=false;$('abort').disabled=true}}
    $('upload').onclick=startUpload;$('abort').onclick=async()=>{cancelled=true;try{await request('/api/ota/abort',{method:'POST'});log('sys','已通知 ESP32 取消本次升级')}catch(e){log('err',e.message)}};$('reboot').onclick=async()=>{try{log('tx','请求设备重启');await request('/api/ota/reboot',{method:'POST'});log('sys','设备正在重启，请稍候...');$('reboot').disabled=true}catch(e){log('err',e.message)}};$('clear').onclick=()=>$('console').replaceChildren();
    async function refresh(){if(uploading)return;try{const s=await request('/api/status',{cache:'no-store'});$('online').textContent='设备在线';$('version').textContent=s.version;$('partition').textContent=s.running_partition;$('ip').textContent=s.ip;$('rssi').textContent=s.rssi+' dBm';if(s.state==='complete')$('reboot').disabled=false}catch(e){$('online').textContent='设备离线'}}setInterval(refresh,1000);refresh();log('sys','OTA 控制台已连接，等待固件。');
  </script>
</body>
</html>
